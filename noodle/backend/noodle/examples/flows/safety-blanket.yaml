# Safety flows for an electric blanket on a smart plug: a wheel long press toggles it, and it switches
# itself off after 2 hours. Copy to your config/flows/ folder and change the device ids (see
# GET /api/devices) to your own. They start switched off.
id: safety-blanket
name: Blanket
enabled: false
nodes:
  press:
    type: trigger.event
    device_id: matter:2
    outputs:
      - button_3:long_press
      - button_6:long_press
      - button_9:long_press
  toggle:
    type: action.device
    device_id: matter:1
    key: switch_1
    inputs:
      - toggle
  change:
    type: trigger.state
    device_id: matter:1
    outputs:
      - switch_1:on
      - switch_1:off
  wait: {type: action.timer, minutes: 120}
  off:
    type: action.device
    device_id: matter:1
    key: switch_1
    inputs:
      - off
  tell:
    type: action.notify
    title: Blanket off
    message: The blanket was on for 2 hours and has been switched off.
    priority: default
edges:
  - {from: press, out: button_3:long_press, to: toggle, in: toggle}
  - {from: press, out: button_6:long_press, to: toggle, in: toggle}
  - {from: press, out: button_9:long_press, to: toggle, in: toggle}
  - {from: change, out: switch_1:on, to: wait, in: start}
  - {from: change, out: switch_1:off, to: wait, in: stop}
  - {from: wait, to: off, in: off}
  - {from: off, to: tell}
layout:
  press: [0, 0]
  toggle: [400, 0]
  change: [0, 280]
  wait: [360, 260]
  off: [720, 260]
  tell: [1080, 260]
