[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noodle-home"
dynamic = ["version"]
description = "Noodle: one place to see and control your smart home (Zigbee, Matter, Hue, Bluetooth) with automations you can edit as files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "itsdangerous==2.2.0",
    "aiomqtt==2.3.0",
    "websockets==13.1",
    "httpx==0.28.1",
    "pychromecast==14.0.5",
    "bleak==0.22.3",
    "ruamel.yaml==0.19.1",
    "tzdata==2025.2",
]

[project.scripts]
noodle = "noodle.__main__:cli"

[tool.setuptools.dynamic]
version = { attr = "noodle.__version__" }

[tool.setuptools.packages.find]
include = ["noodle*"]

[tool.setuptools.package-data]
# The web interface, copied here by build-wheel.sh before building.
noodle = ["static/**/*", "examples/**/*"]

[tool.pytest.ini_options]
# So a plain `pytest` (as in CI) finds the package, not only `python -m pytest`.
pythonpath = ["."]
testpaths = ["tests"]
