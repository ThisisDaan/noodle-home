# Used by install.sh only when data/zigbee2mqtt/configuration.yaml does not exist.
# If you restore a Zigbee2MQTT backup, keep your own file and only change the
# mqtt server and serial port as described in the README.
homeassistant:
  enabled: true
permit_join: false
mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://mosquitto:1883
serial:
  port: /dev/ttyUSB0
  adapter: zstack
frontend:
  port: 8080
advanced:
  network_key: GENERATE
